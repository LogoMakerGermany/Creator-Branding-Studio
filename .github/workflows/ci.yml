name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Diagnose phase F FFmpeg roundtrip
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          node --version
          FFMPEG_PATH="$(node --input-type=module -e "import p from 'ffmpeg-static'; console.log(p)")"
          echo "FFmpeg path: $FFMPEG_PATH"
          ls -l "$FFMPEG_PATH"
          test -x "$FFMPEG_PATH"
          "$FFMPEG_PATH" -version
          ./node_modules/.bin/tsx --test --test-concurrency=1 \
            backend/src/services/video.phase-f.test.ts

      - name: Test backend
        run: npm test
